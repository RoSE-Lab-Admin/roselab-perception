# Gantry + L515 lidars - gantry@192.168.2.99 (Minisforum)
# Replaces: ros2 run gantry_services gantry_capture_service
#   (same data dir, HTTP port and topics; legacy sensors=[p_l515_center, p_l515_west,
#    p_l515_east] == profile "lidar_scan")
#
#   ros2 launch remote_data_collector remote_data_collector.launch.py name:=gantry
#
# Pick individual lidars per goal, e.g.:  rdc start /gantry -p gantry_state -p p_l515_center -d 30
/**:
  ros__parameters:
    data_dir: ~/RoSE_Bags
    default_bag_name: lidar_bags
    default_profiles: [lidar_scan]
    max_concurrent_recordings: 1
    min_free_space_mb: 4096
    stop_free_space_mb: 1024
    http:
      port: 8000
      bind: 0.0.0.0
      advertise_host: 192.168.2.99
    profiles:
      gantry_state:
        description: "Gantry pose/state and transforms"
        topics:
          - /tf
          - /tf_static
          - /gantry/gantry_status/gantry_state
      p_l515_center:
        description: "Center L515: aligned depth + color"
        topics:
          - /p_l515_center/aligned_depth_to_color/image_raw
          - /p_l515_center/aligned_depth_to_color/camera_info
          - /p_l515_center/color/image_raw
          - /p_l515_center/color/camera_info
          - /p_l515_center/extrinsics/depth_to_color
      p_l515_west:
        description: "West L515: aligned depth + color"
        topics:
          - /p_l515_west/aligned_depth_to_color/image_raw
          - /p_l515_west/aligned_depth_to_color/camera_info
          - /p_l515_west/color/image_raw
          - /p_l515_west/color/camera_info
          - /p_l515_west/extrinsics/depth_to_color
      p_l515_east:
        description: "East L515: aligned depth + color"
        topics:
          - /p_l515_east/aligned_depth_to_color/image_raw
          - /p_l515_east/aligned_depth_to_color/camera_info
          - /p_l515_east/color/image_raw
          - /p_l515_east/color/camera_info
          - /p_l515_east/extrinsics/depth_to_color
      lidar_scan:
        description: "Full scan: all three L515s + gantry state (legacy default)"
        include: [gantry_state, p_l515_center, p_l515_west, p_l515_east]
