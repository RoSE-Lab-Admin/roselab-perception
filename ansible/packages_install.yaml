---
# Install arbitrary apt packages and/or local .deb files on LAN hosts through Slade's apt cache.
#   ./packages_install.sh rosey htop iperf3
#   ansible-playbook packages_install.yaml -e target=nuc -e '{"deb_files": ["debs/foo_1.0_amd64.deb"]}'
- name: Apt proxy
  ansible.builtin.import_playbook: apt_proxy_setup.yaml

- name: Install packages
  hosts: "{{ target | default('all') }}"
  become: true
  roles:
    - apt_client
